name: CI

on:
  push:
    branches:
      - main
  pull_request: {}
  schedule:
    # Weekly run against the newest Twenty image to catch platform changes early.
    - cron: '0 6 * * 1'
  workflow_call: {}

permissions:
  contents: read

# Only superseded pull request runs are cancelled; runs on main and publish runs always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Needs no Twenty instance, so lint and unit failures report in a few minutes. The typecheck and build run against
  # the uninstalled Twenty client, like `yarn twenty app:publish` in the publish workflow.
  checks:
    name: Lint, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Check for real email addresses
        run: yarn check:emails

      - name: Unit tests with coverage
        run: yarn test:coverage

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TWENTY_VERSION: ${{ github.event_name == 'schedule' && 'latest' || 'v2.42.6' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Spawn Twenty test instance
        id: twenty
        uses: twentyhq/twenty/.github/actions/spawn-twenty-app-dev-test@87339fe7489c3a3c0ea72aad593a2a538357291c # twenty/v2.43.0
        with:
          twenty-version: ${{ env.TWENTY_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # Syncs the app to the test instance, which also generates the typed API client.
      - name: Integration tests
        run: yarn test:integration
        env:
          TWENTY_API_URL: ${{ steps.twenty.outputs.server-url }}
          TWENTY_API_KEY: ${{ steps.twenty.outputs.api-key }}

      # The generated client adds checks the uninstalled one cannot make.
      - name: Typecheck against the generated client
        run: yarn typecheck
