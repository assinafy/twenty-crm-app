# Keeps the SHA-pinned actions and the npm dependencies current. Every pull request runs the full CI suite.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # New releases wait a week before a pull request, so a compromised release is usually caught first.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # New releases wait a week before a pull request, so a compromised release is usually caught first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # The app targets Node.js 24 (.nvmrc, engines.node); its types move with the runtime, not ahead of it.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    groups:
      # twenty-sdk, twenty-client-sdk and twenty-ui are released together and must stay on the same version.
      twenty:
        patterns:
          - 'twenty-*'
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
